[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-tasks"
version = "1.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.5", "PyYAML>=6"]

[tool.setuptools]
packages = ["portfolio_tasks", "portfolio_tasks.prompts"]
include-package-data = true

[tool.setuptools.package-data]
"portfolio_tasks.prompts" = ["execution.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "build",
    "dist",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["portfolio_tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
