name: PR CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install '.[dev]'
      - name: Lint and formatting validation
        run: |
          ruff check .
          ruff format --check portfolio_tasks tests
          mypy portfolio_tasks
      - run: python -m pytest
      - name: Regenerate deterministic conformance evidence
        run: |
          python -m portfolio_tasks.conformance --check
      - name: Repository security and effect-trap checks
        run: |
          python -m pytest tests/test_conformance.py tests/test_workflow_contract.py
          git diff --check

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: |
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
      - name: Shell syntax validation
        run: |
          find tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
