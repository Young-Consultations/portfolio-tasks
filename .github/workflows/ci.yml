name: PR CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install '.[dev]'
      - name: Lint and formatting validation
        run: |
          ruff check .
          ruff format --check tests/test_codex_e2e.py tests/test_workflow_contract.py tests/fixtures/fake_codex.py
          mypy portfolio_tasks
      - run: python -m pytest --ignore=tests/test_codex_e2e.py

  workflow-contracts:
    name: Workflow contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest tests/test_workflow_contract.py tests/test_workflow_compatibility.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: |
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
      - name: Shell syntax validation
        run: |
          find scripts tests -type f \( \
            -name '*.sh' \
            -o -path 'scripts/prepare-task-branch' \
            -o -path 'scripts/publish-draft-pr' \
          \) -print0 | xargs -0 -r -n1 bash -n

  wrapper-integration:
    name: Codex wrapper integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest tests/test_run_codex.py tests/test_codex_e2e.py

  stubbed-e2e:
    name: Stubbed Codex end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install '.[dev]'
      - run: env -u CODEX_API_KEY -u OPENAI_API_KEY bash tests/e2e/run_stubbed_codex_workflow.sh
