name: Project receiver-validated execution result

on:
  workflow_call:
    inputs:
      execution_result:
        description: Canonical result already accepted by the pinned organization receiver
        required: true
        type: string
      source_issue:
        description: Exact owner/repository#number binding
        required: true
        type: string
      receiver_accepted:
        description: Organization receiver validation decision
        required: true
        type: boolean
    secrets:
      PORTFOLIO_RESULT_TOKEN:
        required: true

permissions: {}

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Authenticate the target-to-portfolio caller
        env:
          CALLER: ${{ github.repository }}
          AUTHORIZED_TARGETS: ${{ vars.PORTFOLIO_RESULT_TARGETS }}
          RECEIVER_ACCEPTED: ${{ inputs.receiver_accepted }}
        run: |
          set -euo pipefail
          [[ "$RECEIVER_ACCEPTED" == true && -n "$AUTHORIZED_TARGETS" ]]
          tr ',' '\n' <<< "$AUTHORIZED_TARGETS" | sed 's/^ *//;s/ *$//' | grep -Fx -- "$CALLER" >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check .
      - name: Validate binding and prepare sanitized terminal projection
        env:
          RESULT: ${{ inputs.execution_result }}
          SOURCE: ${{ inputs.source_issue }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re
          from portfolio_tasks.source_lifecycle import CONTRACT, TERMINAL_STATUSES

          result = json.loads(os.environ["RESULT"])
          source = os.environ["SOURCE"]
          if not re.fullmatch(r"Young-Consultations/portfolio-tasks#[1-9][0-9]*", source):
              raise SystemExit("result is not bound to this portfolio")
          required = ("delivery_id", "correlation_id", "target_repository")
          if result.get("contract_version") != CONTRACT or any(not result.get(k) for k in required):
              raise SystemExit("result identity binding is incomplete")
          if result.get("source_issue", source) != source:
              raise SystemExit("result source binding conflicts")
          if result.get("execution_status") not in TERMINAL_STATUSES:
              raise SystemExit("result is not a supported terminal outcome")
          canonical = json.dumps(result, sort_keys=True, separators=(",", ":"))
          digest = hashlib.sha256(canonical.encode()).hexdigest()
          safe = {
              key: result.get(key) for key in (
                  "task_id", "delivery_id", "correlation_id", "target_repository",
                  "execution_status", "validation_result", "test_result", "failure_category",
                  "diagnostic_summary", "pull_request_url", "workflow_url", "completed_at",
              )
          }
          marker = f"<!-- ai-sdlc-result: {result['delivery_id']}; sha256: {digest} -->"
          with open(os.environ["RUNNER_TEMP"] + "/projection.md", "w", encoding="utf-8") as stream:
              stream.write(marker + "\n### Receiver-validated execution result\n```json\n")
              stream.write(json.dumps(safe, indent=2, sort_keys=True) + "\n```\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"ISSUE_NUMBER={source.rsplit('#', 1)[1]}\n")
              stream.write(f"RESULT_DELIVERY={result['delivery_id']}\nRESULT_CORRELATION={result['correlation_id']}\n")
              stream.write(f"RESULT_TARGET={result['target_repository']}\nRESULT_DIGEST={digest}\n")
          PY
      - name: Apply once or visibly quarantine conflicting evidence
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_RESULT_TOKEN }}
        run: |
          set -euo pipefail; set +x
          comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
          delivery_binding="delivery=$RESULT_DELIVERY; correlation=$RESULT_CORRELATION; target=$RESULT_TARGET"
          admission_count="$(jq --arg binding "$delivery_binding" \
            '[.[] | select((.body // "") | contains("ai-sdlc-admission: task=") and contains($binding))] | length' <<< "$comments")"
          if [[ "$admission_count" -ne 1 ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels" \
              -f 'labels[]=status:result-quarantined' >/dev/null
            exit 1
          fi
          matches="$(jq --arg id "ai-sdlc-result: $RESULT_DELIVERY;" '[.[] | select((.body // "") | contains($id))]' <<< "$comments")"
          count="$(jq length <<< "$matches")"
          if [[ "$count" -eq 1 ]] && jq -e --arg digest "sha256: $RESULT_DIGEST" \
              '.[0].body | contains($digest)' <<< "$matches" >/dev/null; then
            exit 0
          fi
          if [[ "$count" -ne 0 ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels" \
              -f 'labels[]=status:result-quarantined' >/dev/null
            echo 'Conflicting or ambiguous terminal result quarantined; existing result was not overwritten.' \
              > "$RUNNER_TEMP/quarantine.md"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -F body=@"$RUNNER_TEMP/quarantine.md" >/dev/null
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -F body=@"$RUNNER_TEMP/projection.md" >/dev/null
