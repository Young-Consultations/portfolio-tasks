name: Project receiver-validated execution result

on:
  repository_dispatch:
    types: [ai-sdlc-execution-result-v2]

permissions: {}

concurrency:
  group: portfolio-result-${{ github.event.client_payload.source_issue }}
  cancel-in-progress: false

env:
  PORTFOLIO_REPOSITORY: Young-Consultations/portfolio-tasks

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Authenticate the organization receiver dispatch identity
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED_SENDERS: ${{ vars.PORTFOLIO_RESULT_SENDERS }}
        run: |
          set -euo pipefail
          [[ -n "$ACTOR" && -n "$AUTHORIZED_SENDERS" ]]
          tr ',' '\n' <<< "$AUTHORIZED_SENDERS" | sed 's/^ *//;s/ *$//' | grep -Fx -- "$ACTOR" >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check --no-input .
      - name: Validate terminal evidence and reconcile source lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          SOURCE_ISSUE: ${{ github.event.client_payload.source_issue }}
          PROJECTION_MODE: result
        run: |
          set -euo pipefail; set +x
          [[ "$SOURCE_ISSUE" =~ ^Young-Consultations/portfolio-tasks#[1-9][0-9]*$ ]]
          export ISSUE_NUMBER="${SOURCE_ISSUE##*#}"
          python -m portfolio_tasks.terminal_projection
