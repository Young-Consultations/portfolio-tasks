name: Portfolio Dispatch Contract

on:
  workflow_dispatch:
    inputs:
      source_issue_number:
        description: "Portfolio issue number to validate before Codex dispatch"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-dispatch-contract-${{ inputs.source_issue_number }}
  cancel-in-progress: false

jobs:
  validate-dispatch-contract:
    name: Validate dispatch contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portfolio-tasks
        uses: actions/checkout@v4

      - name: Validate issue number
        run: |
          set -euo pipefail
          [[ "${SOURCE_ISSUE_NUMBER}" =~ ^[0-9]+$ ]]
        env:
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}

      - name: Read source issue
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${SOURCE_ISSUE_NUMBER}" > issue.json
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}

      - name: Build and validate canonical task contract
        id: contract
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e
          error_file="$RUNNER_TEMP/contract-error.txt"
          scripts/build-task-contract.sh issue.json task-contract.json 2> "$error_file"
          status=$?
          if [[ $status -eq 0 ]]; then
            scripts/validate-task-contract.sh task-contract.json 2> "$error_file"
            status=$?
          fi
          if [[ $status -ne 0 ]]; then
            reason=$(head -n 1 "$error_file")
            printf 'Task contract validation failed: %s\n' "$reason" > validation-comment.md
          fi
          {
            echo 'comment<<EOF'
            [[ -f validation-comment.md ]] && cat validation-comment.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Store canonical task payload
        uses: actions/upload-artifact@v4
        with:
          name: task-contract-${{ inputs.source_issue_number }}-${{ github.run_attempt }}
          path: task-contract.json
          if-no-files-found: error
          retention-days: 30

      - name: Comment with actionable validation failure
        if: failure() && steps.contract.outputs.comment != ''
        run: gh issue comment "$SOURCE_ISSUE_NUMBER" --body-file validation-comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
