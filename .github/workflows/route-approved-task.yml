name: Route approved task to Codex

on:
  issues:
    types: [labeled, edited]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: route-approved-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  invalidate-edited-approval:
    if: github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Require renewed approval after issue edits
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail; set +x
          approved="$(gh api \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels" \
            --jq 'any(.[]; .name == "status:approved")')"
          if [[ "$approved" == true ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/status%3Aapproved" \
              --silent
          fi

  prepare:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.gate.outputs.route }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
      task_contract_json: ${{ steps.contract.outputs.task_contract_json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Apply approval and idempotency gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
        run: python -m portfolio_tasks.cli route-check "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Check out organization control-plane files
        if: steps.gate.outputs.route == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Young-Consultations/.github
          ref: ai-sdlc-v2.1.0
          token: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          path: ${{ runner.temp }}/shared-platform
          persist-credentials: false

      - name: Install pinned shared contracts
        if: steps.gate.outputs.route == 'true'
        run: |
          set -euo pipefail; set +x
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "$RUNNER_TEMP/shared-platform"

      - name: Build and validate canonical task contract
        if: steps.gate.outputs.route == 'true'
        id: contract
        env:
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: |
          set -euo pipefail; set +x
          printf '%s' "$ISSUE_JSON" > "$RUNNER_TEMP/source-issue.json"
          python -m ai_sdlc_contracts build-task-contract \
            --source-repository "$GITHUB_REPOSITORY" \
            --issue-json "$RUNNER_TEMP/source-issue.json" \
            --execution-mode implement \
            --output "$RUNNER_TEMP/task-contract.json"
          python -m ai_sdlc_contracts validate-task "$RUNNER_TEMP/task-contract.json"
          delimiter="contract_$(openssl rand -hex 16)"
          {
            printf 'task_contract_json<<%s\n' "$delimiter"
            cat "$RUNNER_TEMP/task-contract.json"
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

  route:
    needs: prepare
    if: needs.prepare.outputs.route == 'true'
    uses: Young-Consultations/.github/.github/workflows/codex-router.yml@ai-sdlc-v2.1.0
    with:
      task_payload: ${{ needs.prepare.outputs.task_contract_json }}
      execution_mode: implement
    secrets:
      CODEX_ROUTER_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}

  mark-queued:
    needs: [prepare, route]
    if: needs.route.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Replace approval status after router acceptance
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
        run: |
          set -euo pipefail; set +x
          # Persist the terminal marker first. If approval removal then fails, a
          # redelivery sees status:queued and the live-issue gate will not route
          # the task a second time.
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels" \
            -f 'labels[]=status:queued' >/dev/null
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/status%3Aapproved"
