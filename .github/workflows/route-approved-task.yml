name: Admit approved portfolio task

on:
  issues:
    types: [labeled, edited]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: portfolio-admission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Any edit revokes approval before another effect can occur.
  invalidate-material-edit:
    if: github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Invalidate approval projection before any new effect
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_ISSUE_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail; set +x
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/status%3Aapproved" --silent || true
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" \
            -f 'labels[]=status:proposed' >/dev/null

  prepare:
    if: github.event.action == 'labeled' && github.event.label.name == 'status:approved'
    runs-on: ubuntu-latest
    outputs:
      task_payload: ${{ steps.task.outputs.task_payload }}
      execution_mode: ${{ steps.task.outputs.execution_mode }}
      issue: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check --no-input .
      - name: Require an explicitly authorized human approver
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED_APPROVERS: ${{ vars.PORTFOLIO_APPROVERS }}
        run: |
          set -euo pipefail
          [[ -n "$ACTOR" && -n "$AUTHORIZED_APPROVERS" ]]
          tr ',' '\n' <<< "$AUTHORIZED_APPROVERS" | sed 's/^ *//;s/ *$//' | grep -Fx -- "$ACTOR" >/dev/null
          [[ "$ACTOR" != *'[bot]' ]]
      - name: Construct and validate the approved material revision
        id: task
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_ISSUE_TOKEN }}
          EVENT_ISSUE: ${{ toJSON(github.event.issue) }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail; set +x
          # Re-read current authority, then compare its material identity with
          # the labeled event. Incidental updated_at changes are not authority.
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > "$RUNNER_TEMP/current-issue.json"
          python - <<'PY'
          import json
          import os

          from jsonschema import Draft202012Validator, FormatChecker

          from portfolio_tasks.issue_parser import IssueFormParser, TargetRepositoryParser
          from portfolio_tasks.source_lifecycle import (
              Approval,
              SourceRevision,
              canonical_task,
              normalize_task_type,
          )

          def revision_from(issue):
              form = IssueFormParser(issue.get("body") or "")
              dependency_value = form.value("Dependency issue references").strip()
              material = {
                  "project": form.value("Project").strip(),
                  "priority": form.value("Priority").strip().casefold(),
                  "task_type": normalize_task_type(form.value("Task type")),
                  "parallel_safe": form.value("Parallel-safe").strip().casefold() == "yes",
                  "risk": form.value("Risk").strip().casefold(),
                  "scope": form.value("Estimated scope").strip().casefold(),
                  "instructions": issue.get("body") or "",
                  "created_by": str(issue.get("user", {}).get("login") or ""),
              }
              return SourceRevision(
                  source_issue=f'{os.environ["GITHUB_REPOSITORY"]}#{issue["number"]}',
                  material=material,
                  status="approved",
                  target_repository=TargetRepositoryParser.parse(
                      form.value("Target repository")
                  ) or "",
                  execution_mode=form.value("Execution mode"),
                  executor=form.value("Executor"),
                  dependencies=() if dependency_value.casefold() == "none" else ("unresolved",),
                  sensitivity=form.value("Sensitivity declaration"),
              )

          event_issue = json.loads(os.environ["EVENT_ISSUE"])
          with open(os.environ["RUNNER_TEMP"] + "/current-issue.json", encoding="utf-8") as stream:
              current_issue = json.load(stream)
          labels = {label["name"] for label in current_issue.get("labels", [])}
          if current_issue.get("state") != "open" or "status:approved" not in labels:
              raise SystemExit("current issue is not open and approved")
          event_revision = revision_from(event_issue)
          current_revision = revision_from(current_issue)
          if event_revision.task_id != current_revision.task_id:
              raise SystemExit("approval event does not match the current material revision")

          task = canonical_task(
              current_revision,
              Approval(current_revision.task_id, os.environ["GITHUB_ACTOR"], True),
          )
          with open("contracts/task-contract.schema.json", encoding="utf-8") as stream:
              schema = json.load(stream)
          errors = sorted(
              Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(task),
              key=lambda error: list(error.absolute_path),
          )
          if errors:
              raise SystemExit("constructed task does not conform to the exact task-contract/v2 schema")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("task_payload=" + json.dumps(task, separators=(",", ":"), sort_keys=True) + "\n")
              stream.write("execution_mode=" + current_revision.execution_mode + "\n")
          PY

  route:
    needs: prepare
    uses: Young-Consultations/.github/.github/workflows/codex-router.yml@ai-sdlc-v2.4.1
    with:
      task_payload: ${{ needs.prepare.outputs.task_payload }}
      execution_mode: ${{ needs.prepare.outputs.execution_mode }}
    secrets:
      CODEX_ROUTER_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}

  project-queued:
    needs: [prepare, route]
    if: needs.route.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Project queued after router-owned durable admission and dispatch
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_ISSUE_TOKEN }}
          ISSUE: ${{ needs.prepare.outputs.issue }}
        run: |
          set -euo pipefail; set +x
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" \
            -f 'labels[]=status:queued' >/dev/null
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/status%3Aapproved" --silent || true
