name: Admit approved portfolio task

on:
  issues:
    types: [labeled, edited]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: portfolio-admission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Any edit revokes the earlier approval projection before another effect can occur.
  invalidate-material-edit:
    if: github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Invalidate approval projection before any new effect
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_ISSUE_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail; set +x
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/status%3Aapproved" --silent || true
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" \
            -f 'labels[]=status:proposed' >/dev/null

  prepare:
    if: github.event.action == 'labeled' && github.event.label.name == 'status:approved'
    runs-on: ubuntu-latest
    outputs:
      task_payload: ${{ steps.task.outputs.task_payload }}
      execution_mode: ${{ steps.task.outputs.execution_mode }}
      issue: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check --no-input .
      - name: Require an explicitly authorized human approver
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED_APPROVERS: ${{ vars.PORTFOLIO_APPROVERS }}
        run: |
          set -euo pipefail
          [[ -n "$ACTOR" && -n "$AUTHORIZED_APPROVERS" ]]
          tr ',' '\n' <<< "$AUTHORIZED_APPROVERS" | sed 's/^ *//;s/ *$//' | grep -Fx -- "$ACTOR" >/dev/null
          [[ "$ACTOR" != *'[bot]' ]]
      - name: Construct and validate the current exact task-contract revision
        id: task
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_ISSUE_TOKEN }}
          EVENT_UPDATED_AT: ${{ github.event.issue.updated_at }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail; set +x
          # A webhook is only an event snapshot. Re-read the issue so delayed or
          # redelivered approval events cannot route an edited revision.
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > "$RUNNER_TEMP/current-issue.json"
          python - <<'PY'
          import json
          import os

          from jsonschema import Draft202012Validator, FormatChecker

          from portfolio_tasks.issue_parser import IssueFormParser, TargetRepositoryParser
          from portfolio_tasks.source_lifecycle import (
              Approval,
              SourceRevision,
              canonical_task,
              normalize_task_type,
          )

          with open(os.environ["RUNNER_TEMP"] + "/current-issue.json", encoding="utf-8") as stream:
              issue = json.load(stream)
          labels = {label["name"] for label in issue.get("labels", [])}
          if issue.get("state") != "open" or "status:approved" not in labels:
              raise SystemExit("current issue is not open and approved")
          if issue.get("updated_at") != os.environ["EVENT_UPDATED_AT"]:
              raise SystemExit("approval event does not match the current issue revision")
          form = IssueFormParser(issue.get("body") or "")
          if form.value("Execution status") != "approved":
              raise SystemExit("current issue body is not approved")

          source = f'{os.environ["GITHUB_REPOSITORY"]}#{issue["number"]}'
          target = TargetRepositoryParser.parse(form.value("Target repository")) or ""
          mode = form.value("Execution mode")
          dependency_value = form.value("Dependency issue references").strip()
          material = {
              "project": form.value("Project").strip(),
              "priority": form.value("Priority").strip().casefold(),
              "task_type": normalize_task_type(form.value("Task type")),
              "parallel_safe": form.value("Parallel-safe").strip().casefold() == "yes",
              "risk": form.value("Risk").strip().casefold(),
              "scope": form.value("Estimated scope").strip().casefold(),
              "instructions": issue.get("body") or "",
              "created_by": str(issue.get("user", {}).get("login") or ""),
          }
          revision = SourceRevision(
              source_issue=source,
              material=material,
              status=form.value("Execution status"),
              target_repository=target,
              execution_mode=mode,
              executor=form.value("Executor"),
              dependencies=() if dependency_value.casefold() == "none" else ("unresolved",),
              sensitivity=form.value("Sensitivity declaration"),
          )
          task = canonical_task(
              revision,
              Approval(revision.task_id, os.environ["GITHUB_ACTOR"], True),
          )
          with open("contracts/task-contract.schema.json", encoding="utf-8") as stream:
              schema = json.load(stream)
          errors = sorted(
              Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(task),
              key=lambda error: list(error.absolute_path),
          )
          if errors:
              raise SystemExit("constructed task does not conform to the exact task-contract/v2 schema")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("task_payload=" + json.dumps(task, separators=(",", ":"), sort_keys=True) + "\n")
              stream.write("execution_mode=" + mode + "\n")
          PY

  route:
    needs: prepare
    uses: Young-Consultations/.github/.github/workflows/codex-router.yml@ai-sdlc-v2.3.2
    with:
      task_payload: ${{ needs.prepare.outputs.task_payload }}
      execution_mode: ${{ needs.prepare.outputs.execution_mode }}
    secrets:
      CODEX_ROUTER_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}

  project-admission:
    needs: [prepare, route]
    if: needs.route.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Journal the unique receiver-compatible admission
        id: admission
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_ISSUE_TOKEN }}
          ISSUE: ${{ needs.prepare.outputs.issue }}
          TASK_PAYLOAD: ${{ needs.prepare.outputs.task_payload }}
          DELIVERY_ID: ${{ needs.route.outputs.delivery_id }}
          CORRELATION_ID: ${{ needs.route.outputs.correlation_id }}
        run: |
          set -euo pipefail; set +x
          source_issue="$(jq -er '.source_issue' <<< "$TASK_PAYLOAD")"
          target="$(jq -er '.target_repository' <<< "$TASK_PAYLOAD")"
          binding="$(jq -cnS \
            --arg contract_version "ai-sdlc-contract/v2" \
            --arg delivery_id "$DELIVERY_ID" \
            --arg correlation_id "$CORRELATION_ID" \
            --arg source_issue "$source_issue" \
            --arg target_repository "$target" \
            '{contract_version:$contract_version,delivery_id:$delivery_id,
              correlation_id:$correlation_id,source_issue:$source_issue,
              target_repository:$target_repository}')"
          journal_login="$(gh api user --jq .login)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?per_page=100" \
            > "$RUNNER_TEMP/comments.json"
          BINDING="$binding" JOURNAL_LOGIN="$journal_login" python - <<'PY'
          import json
          import os
          import re

          binding = json.loads(os.environ["BINDING"])
          with open(os.environ["RUNNER_TEMP"] + "/comments.json", encoding="utf-8") as stream:
              comments = json.load(stream)
          pattern = re.compile(r"<!-- ai-sdlc-admission:v2 (\{[^\n]*\}) -->")
          existing = []
          for comment in comments:
              if comment.get("user", {}).get("login") != os.environ["JOURNAL_LOGIN"]:
                  continue
              for match in pattern.finditer(comment.get("body") or ""):
                  try:
                      value = json.loads(match.group(1))
                  except json.JSONDecodeError:
                      continue
                  if value.get("delivery_id") == binding["delivery_id"]:
                      existing.append(value)
          if existing and any(value != binding for value in existing):
              raise SystemExit("conflicting admission journal exists for this delivery")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("append=" + ("false" if existing else "true") + "\n")
              stream.write(
                  "marker=<!-- ai-sdlc-admission:v2 "
                  + json.dumps(binding, separators=(",", ":"), sort_keys=True)
                  + " -->\n"
              )
          PY
      - name: Append admission only once
        if: steps.admission.outputs.append == 'true'
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_ISSUE_TOKEN }}
          ISSUE: ${{ needs.prepare.outputs.issue }}
          MARKER: ${{ steps.admission.outputs.marker }}
        run: |
          set -euo pipefail; set +x
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            -f body="$MARKER" >/dev/null
      - name: Project queued only after durable admission
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_ISSUE_TOKEN }}
          ISSUE: ${{ needs.prepare.outputs.issue }}
        run: |
          set -euo pipefail; set +x
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" \
            -f 'labels[]=status:queued' >/dev/null
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/status%3Aapproved" --silent || true
