name: Reconcile admitted delivery without terminal result

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Portfolio source issue number whose admitted delivery is stuck queued.
        required: true
        type: string
      delivery_id:
        description: Exact logical delivery identity from the durable admission marker.
        required: true
        type: string
      target_run_id:
        description: Completed failed/cancelled/timed-out target workflow run ID used as evidence.
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-result-Young-Consultations/portfolio-tasks#${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  TRUST_POLICY_RELEASE: ai-sdlc-v3.0.3
  ACCEPTED_CONTROL_PLANE_RELEASES_JSON: '["ai-sdlc-v3.0.1","ai-sdlc-v3.0.2","ai-sdlc-v3.0.3"]'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check --no-input .
      - name: Require an explicitly authorized human reconciler
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED_APPROVERS: ${{ vars.PORTFOLIO_APPROVERS }}
        run: |
          set -euo pipefail
          [[ -n "$ACTOR" && -n "$AUTHORIZED_APPROVERS" ]]
          tr ',' '\n' <<< "$AUTHORIZED_APPROVERS" | sed 's/^ *//;s/ *$//' | grep -Fx -- "$ACTOR" >/dev/null
          [[ "$ACTOR" != *'[bot]' ]]
      - name: Load immutable control-plane trust policy
        env:
          GH_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
        run: |
          set -euo pipefail; set +x
          gh api \
            "repos/Young-Consultations/.github/contents/config/codex-result-trust.json?ref=$TRUST_POLICY_RELEASE" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/result-trust.json"
      - name: Load source evidence and resolve admitted target
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DELIVERY_ID: ${{ inputs.delivery_id }}
        run: |
          set -euo pipefail; set +x
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/comments.json"
          python - <<'PY'
          import json
          import os

          from portfolio_tasks.reconciliation import admission_binding

          root = os.environ["RUNNER_TEMP"]
          with open(root + "/comments.json", encoding="utf-8") as stream:
              comments = json.load(stream)
          with open(root + "/result-trust.json", encoding="utf-8") as stream:
              trust = json.load(stream)
          authors = trust.get("trusted_admission_authors")
          try:
              releases = json.loads(os.environ["ACCEPTED_CONTROL_PLANE_RELEASES_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit("reconciliation release policy is invalid") from exc
          if (
              trust.get("policy_format_version") != 2
              or not isinstance(authors, list)
              or not isinstance(releases, list)
              or not releases
              or not all(isinstance(item, str) and item for item in releases)
          ):
              raise SystemExit("control-plane reconciliation policy is invalid")
          source = f'{os.environ["GITHUB_REPOSITORY"]}#{os.environ["ISSUE_NUMBER"]}'
          binding = admission_binding(
              comments,
              source_issue=source,
              delivery_id=os.environ["DELIVERY_ID"],
              trusted_admission_authors=frozenset(authors),
              accepted_control_plane_releases=frozenset(releases),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f'target_repository={binding["target_repository"]}\n')
          PY
      - name: Load exact target workflow evidence
        env:
          GH_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
          TARGET_REPOSITORY: ${{ steps.source.outputs.target_repository }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
        run: |
          set -euo pipefail; set +x
          [[ "$TARGET_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$TARGET_REPOSITORY/actions/runs/$TARGET_RUN_ID" > "$RUNNER_TEMP/target-run.json"
          gh run view "$TARGET_RUN_ID" --repo "$TARGET_REPOSITORY" --log > "$RUNNER_TEMP/target-run.log"
      - name: Revalidate and record recovery state
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DELIVERY_ID: ${{ inputs.delivery_id }}
        run: |
          set -euo pipefail; set +x
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/comments.json"
          python - <<'PY'
          import json
          import os

          from portfolio_tasks.reconciliation import decide_missing_result_reconciliation

          root = os.environ["RUNNER_TEMP"]
          with open(root + "/issue.json", encoding="utf-8") as stream:
              issue = json.load(stream)
          with open(root + "/comments.json", encoding="utf-8") as stream:
              comments = json.load(stream)
          with open(root + "/target-run.json", encoding="utf-8") as stream:
              target_run = json.load(stream)
          with open(root + "/target-run.log", encoding="utf-8") as stream:
              target_run_log = stream.read()
          with open(root + "/result-trust.json", encoding="utf-8") as stream:
              trust = json.load(stream)
          authors = trust.get("trusted_admission_authors")
          try:
              releases = json.loads(os.environ["ACCEPTED_CONTROL_PLANE_RELEASES_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit("reconciliation release policy is invalid") from exc
          if (
              trust.get("policy_format_version") != 2
              or not isinstance(authors, list)
              or not isinstance(releases, list)
              or not releases
              or not all(isinstance(item, str) and item for item in releases)
          ):
              raise SystemExit("control-plane reconciliation policy is invalid")

          source = f'{os.environ["GITHUB_REPOSITORY"]}#{os.environ["ISSUE_NUMBER"]}'
          decision = decide_missing_result_reconciliation(
              issue=issue,
              comments=comments,
              source_issue=source,
              delivery_id=os.environ["DELIVERY_ID"],
              target_run=target_run,
              target_run_log=target_run_log,
              trusted_admission_authors=frozenset(authors),
              accepted_control_plane_releases=frozenset(releases),
          )
          if decision.comment:
              with open(root + "/reconciliation.md", "w", encoding="utf-8") as stream:
                  stream.write(decision.comment)
          with open(root + "/reconciliation-action", "w", encoding="utf-8") as stream:
              stream.write(decision.action)
          PY
          action="$(cat "$RUNNER_TEMP/reconciliation-action")"
          if [[ "$action" == "apply" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -F body=@"$RUNNER_TEMP/reconciliation.md" >/dev/null
          fi
          queued="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            --jq '[.labels[].name] | index("status:queued") != null')"
          if [[ "$queued" == "true" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/status%3Aqueued" --silent
          fi
