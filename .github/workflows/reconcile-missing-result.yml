name: Reconcile admitted delivery without terminal result

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Portfolio source issue number whose admitted delivery is stuck queued.
        required: true
        type: string
      delivery_id:
        description: Exact logical delivery identity from the durable admission marker.
        required: true
        type: string
      target_run_id:
        description: Completed failed/cancelled/timed-out target workflow run ID used as evidence.
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-reconcile-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check --no-input .
      - name: Require an explicitly authorized human reconciler
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED_APPROVERS: ${{ vars.PORTFOLIO_APPROVERS }}
        run: |
          set -euo pipefail
          [[ -n "$ACTOR" && -n "$AUTHORIZED_APPROVERS" ]]
          tr ',' '\n' <<< "$AUTHORIZED_APPROVERS" | sed 's/^ *//;s/ *$//' | grep -Fx -- "$ACTOR" >/dev/null
          [[ "$ACTOR" != *'[bot]' ]]
      - name: Load source evidence and resolve admitted target
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DELIVERY_ID: ${{ inputs.delivery_id }}
        run: |
          set -euo pipefail; set +x
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/comments.json"
          python - <<'PY'
          import json
          import os

          from portfolio_tasks.reconciliation import admission_binding

          source = f'{os.environ["GITHUB_REPOSITORY"]}#{os.environ["ISSUE_NUMBER"]}'
          with open(os.environ["RUNNER_TEMP"] + "/comments.json", encoding="utf-8") as stream:
              comments = json.load(stream)
          binding = admission_binding(
              comments,
              source_issue=source,
              delivery_id=os.environ["DELIVERY_ID"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f'target_repository={binding["target_repository"]}\n')
          PY
      - name: Load completed target workflow evidence
        env:
          GH_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
          TARGET_REPOSITORY: ${{ steps.source.outputs.target_repository }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
        run: |
          set -euo pipefail; set +x
          [[ "$TARGET_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$TARGET_REPOSITORY/actions/runs/$TARGET_RUN_ID" > "$RUNNER_TEMP/target-run.json"
      - name: Validate reconciliation evidence
        id: decision
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DELIVERY_ID: ${{ inputs.delivery_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          from portfolio_tasks.reconciliation import decide_missing_result_reconciliation

          root = os.environ["RUNNER_TEMP"]
          with open(root + "/issue.json", encoding="utf-8") as stream:
              issue = json.load(stream)
          with open(root + "/comments.json", encoding="utf-8") as stream:
              comments = json.load(stream)
          with open(root + "/target-run.json", encoding="utf-8") as stream:
              target_run = json.load(stream)
          source = f'{os.environ["GITHUB_REPOSITORY"]}#{os.environ["ISSUE_NUMBER"]}'
          decision = decide_missing_result_reconciliation(
              issue=issue,
              comments=comments,
              source_issue=source,
              delivery_id=os.environ["DELIVERY_ID"],
              target_run=target_run,
          )
          if decision.comment:
              with open(root + "/reconciliation.md", "w", encoding="utf-8") as stream:
                  stream.write(decision.comment)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"action={decision.action}\n")
          PY
      - name: Record recovery state without fabricating a target result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ACTION: ${{ steps.decision.outputs.action }}
        run: |
          set -euo pipefail; set +x
          if [[ "$ACTION" == "apply" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              -F body=@"$RUNNER_TEMP/reconciliation.md" >/dev/null
          fi
          if [[ "$ACTION" == "no-op" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/status%3Aqueued" --silent || true
          else
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/status%3Aqueued" --silent
          fi
