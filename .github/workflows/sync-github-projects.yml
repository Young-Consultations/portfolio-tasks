name: Route ChatGPT Tasks to Phase 1 Project

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: phase1-project-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: github.event.label.name == 'chatgpt-task'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate routing token
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error title=Missing routing token::SLUGGER_GITHUB_TOKEN is unavailable; configure it as a repository Actions secret."
            exit 1
          fi

      - name: Check out trusted router
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Add issue and initialize project fields
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
        run: python -m portfolio_tasks.project_intake
