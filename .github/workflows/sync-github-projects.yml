name: Route ChatGPT Tasks to Phase 1 Project

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: phase1-project-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: github.event.label.name == 'chatgpt-task'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted router
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ secrets.PROJECT_ROUTER_APP_ID }}
          private-key: ${{ secrets.PROJECT_ROUTER_APP_PRIVATE_KEY }}
          owner: Young-Consultations
          repositories: portfolio-tasks
          permission-issues: read
          permission-organization-projects: write

      - name: Add issue and initialize project fields
        env:
          PROJECT_ROUTER_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python -m portfolio_tasks.project_intake
