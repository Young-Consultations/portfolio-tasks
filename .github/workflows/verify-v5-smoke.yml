name: One-shot v5 verify-only maintenance smoke

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Fresh dedicated owner-created issue number; no labels
        required: true
        type: string
      expected_task_id:
        description: Independently reviewed canonical issue revision task ID
        required: true
        type: string
      expected_main_sha:
        description: Exact reviewed and merged wrapper commit
        required: true
        type: string
      confirmation:
        description: Explicit owner confirmation (verify-v5-once)
        required: true
        type: string

permissions: {}

concurrency:
  group: v5-verify-only-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository == 'Young-Consultations/portfolio-tasks' && github.ref == 'refs/heads/main' && github.actor == 'mightyjoe909' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      task_payload: ${{ steps.reserve.outputs.task_payload }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check --no-input .
      - name: Validate owner-bound issue and consume one-shot reservation
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVERS: ${{ vars.PORTFOLIO_APPROVERS }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_TASK_ID: ${{ inputs.expected_task_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python -m portfolio_tasks.verify_smoke

  route:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && github.repository == 'Young-Consultations/portfolio-tasks' && github.ref == 'refs/heads/main' && github.actor == 'mightyjoe909' && github.triggering_actor == 'mightyjoe909' && github.run_attempt == 1 }}
    permissions:
      contents: read
      actions: read
    uses: Young-Consultations/.github/.github/workflows/codex-router.yml@ai-sdlc-v5.0.0
    with:
      task_payload: ${{ needs.prepare.outputs.task_payload }}
      execution_mode: verify
    secrets:
      CODEX_ROUTER_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
