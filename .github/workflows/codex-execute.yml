name: Execute approved Codex task

on:
  workflow_dispatch:
    inputs:
      task_contract_json:
        description: Exact validated ai-sdlc-contract/v1 JSON payload from the router
        required: true
        type: string
      concurrency_group:
        description: Router-generated concurrency group
        required: true
        type: string
      draft_pr_only:
        description: Require draft pull requests
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

jobs:
  execute:
    name: Validate, execute, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPOSITORY: Young-Consultations/portfolio-tasks
      API_ROOT: https://api.github.com
    steps:
      - name: Check out the target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate router inputs and approved source issue
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          TASK_CONTRACT_JSON: ${{ inputs.task_contract_json }}
          DRAFT_PR_ONLY: ${{ inputs.draft_pr_only }}
        run: |
          set -euo pipefail
          set +x
          [[ "$DRAFT_PR_ONLY" == true ]] || { echo '::error::Only draft publication is permitted.'; exit 1; }
          printf '%s' "$TASK_CONTRACT_JSON" > "$RUNNER_TEMP/task-contract.json"
          scripts/validate-task-contract.sh "$RUNNER_TEMP/task-contract.json"
          issue_number=$(jq -r '.source.issue_number' "$RUNNER_TEMP/task-contract.json")
          [[ $(jq -r '.source.repository' "$RUNNER_TEMP/task-contract.json") == "$REPOSITORY" ]] || { echo '::error::Contract source repository mismatch.'; exit 1; }
          [[ $(jq -r '.status' "$RUNNER_TEMP/task-contract.json") == approved ]] || { echo '::error::Contract is not approved.'; exit 1; }
          [[ $(jq -r '.executor' "$RUNNER_TEMP/task-contract.json") == codex ]] || { echo '::error::Contract executor is not Codex.'; exit 1; }
          [[ $(jq -r '.target_repository' "$RUNNER_TEMP/task-contract.json") == "$REPOSITORY" ]] || { echo '::error::Cross-repository execution is forbidden.'; exit 1; }
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$API_ROOT/repos/$REPOSITORY/issues/$issue_number" > "$RUNNER_TEMP/source-issue.json"
          state=$(jq -r '.state' "$RUNNER_TEMP/source-issue.json")
          has_pr=$(jq -r 'has("pull_request")' "$RUNNER_TEMP/source-issue.json")
          echo "Issue state: $state"
          echo "Has pull_request field: $has_pr"
          echo "Issue number: $(jq -r '.number' "$RUNNER_TEMP/source-issue.json")"
          echo "Repository: $REPOSITORY"
          if [[ "$state" != "open" ]]; then
            echo '::error::The source issue is not open.'
            exit 1
          fi
          if [[ "$has_pr" == "true" ]]; then
            echo '::error::The source is a pull request, not an issue.'
            exit 1
          fi
          labels=$(jq -r '[.labels[].name] | join("\n")' "$RUNNER_TEMP/source-issue.json")
          grep -Fqx 'executor:codex' <<< "$labels" || { echo '::error::Missing executor:codex approval label.'; exit 1; }
          grep -Fqx 'status:approved' <<< "$labels" || { echo '::error::Missing status:approved approval label.'; exit 1; }
          if grep -Fqx 'sensitive' <<< "$labels"; then
            echo '::error::Issues marked sensitive cannot be sent to Codex.'
            exit 1
          fi
          branch="codex/issue-${issue_number}-${GITHUB_RUN_ID}"
          printf 'issue_number=%s\nbranch=%s\n' "$issue_number" "$branch" >> "$GITHUB_OUTPUT"

      - name: Install pinned Codex CLI
        shell: bash
        run: npm install --global @openai/codex@0.63.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python development dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir '.[dev]'

      - name: Execute Codex in workspace-write sandbox
        id: codex
        shell: bash
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_MODEL: gpt-5.3-codex
          ISSUE_NUMBER: ${{ steps.authorize.outputs.issue_number }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${CODEX_API_KEY:-}" ]]; then
            echo '::error::CODEX_API_KEY is required for Codex execution.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/instructions.md" <<'EOF'
          Implement the approved task in the attached source issue. Work only in this checkout.
          Do not push, create or merge a pull request, access secrets, change repository or organization
          settings, branch protection, secrets, or approval policy. Do not print environment variables.
          Keep the change focused and production-ready. Run useful checks, but publication and the
          authoritative validation pass are performed by the surrounding workflow.
          EOF
          jq -r '.instructions' "$RUNNER_TEMP/task-contract.json" >> "$RUNNER_TEMP/instructions.md"
          python -m portfolio_tasks.run_codex < "$RUNNER_TEMP/instructions.md"

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          status=$(git status --porcelain=v1 --untracked-files=all)
          [[ -n "$status" ]] || { echo '::error::Codex produced no tracked or untracked changes.'; exit 1; }
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Validate and test repository
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.safe_load_file(f, aliases: true) }' \
            $(find .github -type f \( -name '*.yml' -o -name '*.yaml' \) -print)
          python -m pytest
          ruff check .
          mypy portfolio_tasks
          if command -v actionlint >/dev/null 2>&1; then actionlint; else echo 'actionlint unavailable (not reported as passed)'; fi
          echo 'result=passed' >> "$GITHUB_OUTPUT"

      - name: Commit and push one task branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_AUTOMATION_TOKEN }}
          BRANCH: ${{ steps.authorize.outputs.branch }}
        run: |
          set -euo pipefail
          set +x
          git switch -c "$BRANCH"
          git config user.name 'portfolio-codex[bot]'
          git config user.email 'portfolio-codex[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Implement approved portfolio task #${{ steps.authorize.outputs.issue_number }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open one draft pull request
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_AUTOMATION_TOKEN }}
          BRANCH: ${{ steps.authorize.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.authorize.outputs.issue_number }}
        run: |
          set -euo pipefail
          set +x
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          jq -n --arg title "Codex: implement portfolio task #$ISSUE_NUMBER" --arg head "$BRANCH" \
            --arg body "Draft implementation of #$ISSUE_NUMBER. Validation and repository tests passed in workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
            '{title:$title,head:$head,base:"main",body:$body,draft:true}' > "$RUNNER_TEMP/pr.json"
          curl --fail-with-body --silent --show-error "${auth[@]}" -X POST \
            "$API_ROOT/repos/$REPOSITORY/pulls" --data-binary @"$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-response.json"
          echo "pr_url=$(jq -r '.html_url' "$RUNNER_TEMP/pr-response.json")" >> "$GITHUB_OUTPUT"

      - name: Report success to source issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ steps.authorize.outputs.issue_number }}
          BRANCH: ${{ steps.authorize.outputs.branch }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          set -euo pipefail; set +x
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf 'Codex execution completed.\n\n- Branch: `%s`\n- Draft PR: %s\n- Validation: passed\n- Tests: passed\n- Workflow: %s' "$BRANCH" "$PR_URL" "$workflow_url")
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' -X POST "$API_ROOT/repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null

      - name: Report failed validation or test run
        if: failure() && steps.authorize.outputs.issue_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_AUTOMATION_TOKEN }}
          ISSUE_NUMBER: ${{ steps.authorize.outputs.issue_number }}
          CODEX_RESULT: ${{ steps.codex.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail; set +x
          [[ -n "$CODEX_RESULT" ]] || CODEX_RESULT='not run'
          [[ -n "$TEST_RESULT" ]] || TEST_RESULT='not run'
          body=$(printf 'Codex execution stopped before publication.\n\n- Branch: not published\n- Draft PR: not created\n- Codex execution: %s\n- Validation/tests: %s\n- Workflow: %s/%s/actions/runs/%s' "$CODEX_RESULT" "$TEST_RESULT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' -X POST "$API_ROOT/repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null
