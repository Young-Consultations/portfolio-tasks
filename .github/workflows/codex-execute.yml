name: Execute admitted portfolio-tasks task

on:
  workflow_dispatch:
    inputs:
      execution_input_json:
        description: Complete canonical execution-input/v2 JSON string (serialized JSON, not an object).
        required: true
        type: string
      concurrency_group:
        description: Transport concurrency identity; must exactly match the canonical payload.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: portfolio-tasks-codex-production
    outputs:
      execution_result: ${{ steps.execute.outputs.execution_result }}
      source_issue: ${{ steps.execute.outputs.source_issue }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.63.0
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input '.[dev]'
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - id: execute
        env:
          EXECUTION_INPUT_JSON: ${{ inputs.execution_input_json }}
          CONCURRENCY_GROUP: ${{ inputs.concurrency_group }}
          CALLER_LOGIN: ${{ github.actor }}
          TRUSTED_CALLERS: ${{ secrets.CODEX_TARGET_TRUSTED_CALLERS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_PUBLICATION_TOKEN: ${{ secrets.TARGET_PUBLICATION_TOKEN }}
        run: python3 scripts/codex_target_adapter.py

  report:
    needs: execute
    if: ${{ always() && needs.execute.outputs.execution_result != '' && needs.execute.outputs.source_issue != '' }}
    permissions:
      contents: read
    # The target remains disabled until deliberate issue #117 activation.
    uses: Young-Consultations/.github/.github/workflows/codex-result-receiver.yml@ai-sdlc-v2.3.2
    with:
      execution_result: ${{ needs.execute.outputs.execution_result }}
      source_issue: ${{ needs.execute.outputs.source_issue }}
    secrets:
      CODEX_RESULT_TOKEN: ${{ secrets.CODEX_RESULT_TOKEN }}
