name: Execute canonical Codex task

on:
  workflow_dispatch:
    inputs:
      execution_input_json:
        description: Canonical execution-input.json content
        required: false
        type: string
      execution_input_artifact:
        description: Router-produced execution-input artifact
        required: false
        type: string
      execution_input_run_id:
        description: Router workflow run containing the artifact
        required: false
        type: string
      concurrency_group:
        description: Router-authorized concurrency key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPOSITORY: Young-Consultations/portfolio-tasks
      API_ROOT: https://api.github.com
    steps:
      - name: Check out target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Initialize result state
        run: |
          set -euo pipefail
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/started-at"
          printf '%s\n' invalid_input > "$RUNNER_TEMP/failure-category"
          printf '%s\n' not_run > "$RUNNER_TEMP/validation-result"
          printf '%s\n' not_run > "$RUNNER_TEMP/test-result"
          printf 'TASK_WORKTREE=%s\n' "$RUNNER_TEMP/task-worktree" >> "$GITHUB_ENV"
          printf 'TARGET_WORKTREE=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Download execution-input.json
        if: inputs.execution_input_json == '' && inputs.execution_input_artifact != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.execution_input_artifact }}
          run-id: ${{ inputs.execution_input_run_id }}
          github-token: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          path: ${{ runner.temp }}/execution-input-artifact

      - name: Install target and pinned shared contracts
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          CONTRACTS_COMMIT_SHA: ${{ vars.AI_SDLC_CONTRACTS_COMMIT_SHA }}
        run: |
          set -euo pipefail; set +x
          [[ "$CONTRACTS_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          helper="$RUNNER_TEMP/contracts-credential"
          trap 'rm -f "$helper"' EXIT
          cat > "$helper" <<'EOF'
          #!/usr/bin/env bash
          [[ "${1:-get}" == get ]] || exit 0
          printf '%s\n' username=x-access-token "password=${GH_TOKEN}"
          EOF
          chmod 700 "$helper"
          git -c credential.helper="$helper" -c credential.useHttpPath=true clone --quiet \
            "https://github.com/Young-Consultations/.github.git" "$RUNNER_TEMP/shared-platform"
          git -C "$RUNNER_TEMP/shared-platform" checkout --quiet "$CONTRACTS_COMMIT_SHA"
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "$RUNNER_TEMP/shared-platform" '.[dev]'
          python -c "from importlib.metadata import version; from packaging.version import Version; assert Version(version('ai-sdlc-contracts')) >= Version('1.0.1')"
          python -c "from ai_sdlc_contracts import load_contract_version; assert load_contract_version() == 'ai-sdlc-contract/v2'"

      - name: Materialize and validate execution-input.json
        id: input
        env:
          EXECUTION_INPUT_JSON: ${{ inputs.execution_input_json }}
          EXECUTION_INPUT_ARTIFACT: ${{ inputs.execution_input_artifact }}
        run: |
          set -euo pipefail; set +x
          input="$RUNNER_TEMP/execution-input.json"
          if [[ -n "$EXECUTION_INPUT_JSON" ]]; then
            [[ -z "$EXECUTION_INPUT_ARTIFACT" ]]
            printf '%s' "$EXECUTION_INPUT_JSON" > "$input"
          else
            mapfile -t payloads < <(find "$RUNNER_TEMP/execution-input-artifact" -type f -name execution-input.json -print)
            [[ ${#payloads[@]} -eq 1 ]]
            cp "${payloads[0]}" "$input"
          fi
          python -m portfolio_tasks.execution inspect-input "$input" >> "$GITHUB_OUTPUT"

      - name: Verify router authorization
        id: authorization
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.input.outputs.issue }}
          SOURCE_REPOSITORY: ${{ steps.input.outputs.source_repository }}
        run: |
          set -euo pipefail; set +x
          printf '%s\n' authorization_failed > "$RUNNER_TEMP/failure-category"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          curl --fail --silent --show-error "${auth[@]}" "$API_ROOT/repos/$SOURCE_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/source-issue.json"
          jq -e '.state == "open" and (has("pull_request") | not)' "$RUNNER_TEMP/source-issue.json" >/dev/null
          jq -e '[.labels[].name] | index("executor:codex") != null and (index("status:approved") != null or index("status:queued") != null) and index("sensitive") == null' "$RUNNER_TEMP/source-issue.json" >/dev/null

      - name: Prepare deterministic task branch
        if: ${{ steps.input.outputs.execution_mode == 'implement' }}
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          BRANCH: ${{ steps.input.outputs.branch }}
          BASE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail; set +x
          export PATH=/usr/bin:/bin
          trusted_prepare="$RUNNER_TEMP/prepare-task-branch"
          GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git show \
            "$GITHUB_SHA:scripts/prepare-task-branch" > "$trusted_prepare"
          chmod 500 "$trusted_prepare"
          /usr/bin/bash "$trusted_prepare"
          printf 'TARGET_WORKTREE=%s\n' "$TASK_WORKTREE" >> "$GITHUB_ENV"

      - name: Install pinned actionlint before Codex execution
        env:
          ACTIONLINT_VERSION: v1.7.7
        run: |
          set -euo pipefail; set +x
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          printf '%s/bin\n' "$(go env GOPATH)" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          actionlint -version

      - name: Capture trusted pre-change validation baseline
        run: |
          set -euo pipefail; set +x
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m portfolio_tasks.runtime_validation \
            --capture-baseline \
            --working-directory "$TARGET_WORKTREE" \
            --baseline "$RUNNER_TEMP/validation-baseline.json"

      - name: Install and execute Codex
        if: steps.input.outputs.execution_mode == 'implement'
        id: codex
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.3-codex' }}
        run: |
          set -euo pipefail; set +x
          printf '%s\n' codex_failed > "$RUNNER_TEMP/failure-category"
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          if ! python -c "from portfolio_tasks.prompts import render_execution_prompt"; then
            echo '::error title=Trusted runtime preflight failed::portfolio_tasks.prompts is missing from the trusted GITHUB_SHA checkout.'
            exit 1
          fi
          npm install --global @openai/codex@0.63.0
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from portfolio_tasks.prompts import render_execution_prompt

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          execution_input = json.loads(
              (runner_temp / "execution-input.json").read_text(encoding="utf-8")
          )
          baseline = json.loads((runner_temp / "validation-baseline.json").read_text())
          baseline_context = "Trusted pre-change validation baseline (status only):\n" + "\n".join(
              f"- {item['command']}: {item['status']}" for item in baseline["commands"]
          )
          prompt = render_execution_prompt(
              task_instructions=execution_input["instructions"],
              repository_context=baseline_context,
              validation_commands=[],
          )
          (runner_temp / "instructions.md").write_text(prompt, encoding="utf-8")
          PY
          set +e
          python -m portfolio_tasks.run_codex --working-directory "$TASK_WORKTREE" < "$RUNNER_TEMP/instructions.md"
          codex_status=$?
          set -e
          if (( codex_status != 0 )); then
            exit "$codex_status"
          fi
          codex_outcome=$(jq -r .status "$TASK_WORKTREE/codex-result.json")
          cp "$TASK_WORKTREE/codex-result.json" "$RUNNER_TEMP/codex-result.json"
          rm -- "$TASK_WORKTREE/codex-result.json"
          tree_changed=false
          [[ -z "$(git -C "$TASK_WORKTREE" status --porcelain=v1 --untracked-files=all)" ]] || tree_changed=true
          [[ "$codex_outcome" == changed && "$tree_changed" == true || \
             "$codex_outcome" == already_satisfied && "$tree_changed" == false ]]
          printf '%s\n' "outcome=$codex_outcome" >> "$GITHUB_OUTPUT"
          if [[ "$codex_outcome" == already_satisfied ]]; then
            printf '%s\n' 'no_changes=true' >> "$GITHUB_OUTPUT"
          else
            [[ "$codex_outcome" == changed ]]
            printf '%s\n' 'no_changes=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate target repository
        if: steps.input.outputs.execution_mode == 'verify' || steps.codex.outcome == 'success'
        id: validation
        run: |
          set -euo pipefail; set +x
          printf '%s\n' validation_failed > "$RUNNER_TEMP/failure-category"
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          set +e
          python -m portfolio_tasks.runtime_validation \
            --working-directory "$TARGET_WORKTREE" \
            --baseline "$RUNNER_TEMP/validation-baseline.json" \
            --log "$RUNNER_TEMP/validation.log" \
            --summary "$RUNNER_TEMP/validation-summary.json" \
            --result "$RUNNER_TEMP/codex-result.json"
          validation_status=$?
          set -e
          if [[ ! -s "$RUNNER_TEMP/validation-summary.json" ]]; then
            jq -n '{validation_result:"failed",repairable:false,commands:[{command:"trusted validation suite",classification:"infrastructure_failure"}]}' \
              > "$RUNNER_TEMP/validation-summary.json"
          fi
          if (( validation_status != 0 )) && \
             [[ "$(jq -r '.repairable // false' "$RUNNER_TEMP/validation-summary.json")" == true ]]; then
            mapfile -t python_files < <(git -C "$TARGET_WORKTREE" diff --name-only --diff-filter=ACMR HEAD -- '*.py')
            if (( ${#python_files[@]} )); then
              set +e
              (cd "$TARGET_WORKTREE" && ruff format -- "${python_files[@]}")
              repair_status=$?
              set -e
              printf '%s\n' attempted > "$RUNNER_TEMP/format-repair"
              set +e
              python -m portfolio_tasks.runtime_validation \
                --working-directory "$TARGET_WORKTREE" \
                --baseline "$RUNNER_TEMP/validation-baseline.json" \
                --log "$RUNNER_TEMP/validation.log" \
                --summary "$RUNNER_TEMP/validation-summary.json" \
                --result "$RUNNER_TEMP/codex-result.json"
              validation_status=$?
              set -e
              (( repair_status == 0 )) || validation_status=$repair_status
            fi
          fi
          result=failed
          (( validation_status != 0 )) || result=passed
          printf '%s\n' "$result" > "$RUNNER_TEMP/validation-result"
          printf '%s\n' "$result" > "$RUNNER_TEMP/test-result"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"

      - name: Create task branch and draft PR
        if: always() && steps.input.outputs.execution_mode == 'implement' && steps.codex.outputs.outcome == 'changed'
        id: publish
        env:
          GH_TOKEN: ${{ secrets.SLUGGER_GITHUB_TOKEN }}
          BRANCH: ${{ steps.input.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.input.outputs.issue }}
          VALIDATION_RESULT: ${{ steps.validation.outputs.result || 'failed' }}
          VALIDATION_SUMMARY: ${{ runner.temp }}/validation-summary.json
        run: |
          set -euo pipefail; set +x
          export PATH=/usr/bin:/bin
          trusted_publish="$RUNNER_TEMP/publish-draft-pr"
          GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git show \
            "$GITHUB_SHA:scripts/publish-draft-pr" > "$trusted_publish"
          chmod 500 "$trusted_publish"
          /usr/bin/bash "$trusted_publish"
          {
            echo '### Workflow postconditions'
            echo '- completed: controlled branch committed and pushed'
            echo '- completed: exactly one draft pull request created or updated'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit canonical execution result
        if: always() && steps.input.outcome == 'success'
        env:
          MODE: ${{ steps.input.outputs.execution_mode }}
          AUTHORIZATION_OUTCOME: ${{ steps.authorization.outcome }}
          VALIDATION_RESULT: ${{ steps.validation.outputs.result }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PR_URL: ${{ steps.publish.outputs.url }}
          NO_CHANGES: ${{ steps.codex.outputs.no_changes }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          branch=null; pr=null
          category=$(jq -Rn --arg v "$(cat "$RUNNER_TEMP/failure-category")" '$v')
          status_args=(--mode "$MODE")
          [[ "$AUTHORIZATION_OUTCOME" != success ]] || status_args+=(--authorization-ok)
          [[ "$VALIDATION_RESULT" != passed ]] || status_args+=(--validation-ok)
          [[ "$PUBLISH_OUTCOME" != success ]] || status_args+=(--publish-ok)
          [[ -z "$PR_URL" ]] || status_args+=(--pr-url "$PR_URL")
          [[ "$NO_CHANGES" != true ]] || status_args+=(--no-changes)
          status=$(python -m portfolio_tasks.execution execution-status "${status_args[@]}")
          if [[ "$status" != failed && "$status" != blocked ]]; then
            category=$(jq -Rn --arg v "none" '$v')
          fi
          validation=$(cat "$RUNNER_TEMP/validation-result")
          tests=$(cat "$RUNNER_TEMP/test-result")
          [[ "$MODE" == verify || "$NO_CHANGES" == true ]] || branch=$(jq -Rn --arg v '${{ steps.input.outputs.branch }}' '$v')
          [[ -z "$PR_URL" ]] || pr=$(jq -Rn --arg v "$PR_URL" '$v')
          jq -n --arg version "$(jq -r .contract_version "$RUNNER_TEMP/execution-input.json")" \
            --arg correlation '${{ steps.input.outputs.correlation }}' --arg status "$status" \
            --arg validation "$validation" --arg tests "$tests" \
            --argjson branch "$branch" --argjson pr "$pr" --argjson category "$category" \
            --arg started "$(cat "$RUNNER_TEMP/started-at")" --arg completed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{contract_version:$version,correlation_id:$correlation,execution_status:$status,target_repository:"Young-Consultations/portfolio-tasks",branch_name:$branch,pull_request_url:$pr,workflow_url:(env.GITHUB_SERVER_URL+"/"+env.GITHUB_REPOSITORY+"/actions/runs/"+env.GITHUB_RUN_ID),validation_result:$validation,test_result:$tests,failure_category:$category,failure_message:null,started_at:$started,completed_at:$completed}' \
            > "$RUNNER_TEMP/execution-result.json"
          python -m portfolio_tasks.execution validate-result "$RUNNER_TEMP/execution-result.json"

      - name: Prepare full execution diagnostics
        if: always()
        run: |
          set -euo pipefail; set +x
          [[ -e "$RUNNER_TEMP/codex-trace.log" ]] || : > "$RUNNER_TEMP/codex-trace.log"
          [[ -e "$RUNNER_TEMP/validation.log" ]] || : > "$RUNNER_TEMP/validation.log"
          git -C "$TARGET_WORKTREE" diff --binary --no-ext-diff > "$RUNNER_TEMP/git-diff.patch"

      - name: Upload full execution diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codex-trace.log
            ${{ runner.temp }}/codex-result.json
            ${{ runner.temp }}/validation.log
            ${{ runner.temp }}/git-diff.patch
          if-no-files-found: warn
          retention-days: 30

      - name: Upload canonical execution result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: execution-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/execution-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Conclude execution
        if: always()
        env:
          VALIDATION_RESULT: ${{ steps.validation.outputs.result }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
        run: |
          set -euo pipefail
          [[ "$CODEX_OUTCOME" != failure ]]
          [[ "$PUBLISH_OUTCOME" != failure ]]
          [[ "$VALIDATION_RESULT" != failed ]]
